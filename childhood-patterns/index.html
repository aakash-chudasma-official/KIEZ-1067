:root{--bg:#f6f3eb;--ink:#23372f;--mute:#66736b;--accent:#c47d61;--line:#dddcd1;--white:#fffdf9;--sage:#e5ebe2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.75}.app{display:grid;grid-template-columns:310px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px;background:#f0eee6}.brand{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;line-height:1.2;margin-bottom:8px}.subbrand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.progress{height:7px;background:#d8d9cf;border-radius:50px;overflow:hidden;margin:15px 0 7px}.bar{height:100%;width:0;background:#648271;transition:width .2s}.progressline{font-size:12px;color:var(--mute);margin-bottom:18px}button,input{font:inherit}.search{width:100%;border:1px solid var(--line);background:var(--white);padding:11px 13px;border-radius:12px;outline-color:#648271;margin-bottom:16px}.navchapter{margin:12px 0}.chapterbtn{background:transparent;border:0;color:var(--ink);font-weight:700;text-align:left;cursor:pointer;font-size:13px;padding:9px 8px;width:100%;line-height:1.4}.navitem{display:block;width:100%;background:none;border:0;text-align:left;cursor:pointer;color:var(--mute);font-size:12px;padding:7px 10px 7px 19px;line-height:1.45;border-radius:8px}.navitem:hover,.navitem.active{background:var(--sage);color:var(--ink)}.main{max-width:940px;width:100%;margin:0 auto;padding:54px 70px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-bottom:48px}.tag{display:inline-block;background:#e8e5da;color:#466052;border-radius:25px;font-size:11px;letter-spacing:.12em;padding:7px 14px;text-transform:uppercase;font-weight:700}.hero h1{font-family:'Playfair Display',serif;font-size:clamp(48px,6vw,82px);line-height:1.13;letter-spacing:-.03em;max-width:750px;margin:22px 0}.hero h1 em{color:var(--accent);font-style:normal}.lead{font-size:19px;color:#53675c;max-width:600px}.illustration{height:190px;border-radius:150px 150px 14px 14px;background:radial-gradient(circle at 30% 28%,#f0cfaa 0 18%,transparent 19%),linear-gradient(130deg,#b1bfae,#648271);position:relative;overflow:hidden;margin:44px 0}.illustration:after{content:'';position:absolute;bottom:-100px;left:19%;background:#f6f3eb;width:62%;height:190px;border-radius:48% 52% 0 0;transform:rotate(-7deg)}h2{font-family:'Playfair Display',serif;line-height:1.22;font-size:clamp(35px,4vw,55px);margin:17px 0}h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin-top:35px;color:#597264}.copy{font-size:16px;color:#405249}.note{border-left:3px solid var(--accent);background:#f0eadf;padding:17px 22px;border-radius:0 12px 12px 0;margin:30px 0;font-size:14px}.panel{padding:23px 28px;border:1px solid var(--line);border-radius:16px;background:var(--white);margin:23px 0}.panel.peach{background:#efe6da;border:0}.panel.sage{background:#e7ebe4;border:0}.panel h3{margin:0 0 10px}.panel p{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:35px 0}.btn{cursor:pointer;border:1px solid #345647;border-radius:10px;padding:11px 17px;background:#345647;color:white;font-size:13px;font-weight:700}.btn.secondary{color:#345647;background:transparent}.btn:disabled{opacity:.4;cursor:not-allowed}.chapintro{margin-bottom:35px;color:var(--mute);font-size:18px}.small{color:var(--mute);font-size:13px}.listchap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.chaptercard{background:var(--white);border:1px solid var(--line);text-align:left;padding:19px;border-radius:14px;cursor:pointer;color:var(--ink);font-weight:700;line-height:1.35}.chaptercard span{display:block;color:var(--accent);font-size:11px;margin-bottom:8px}.chaptercard:hover{border-color:#648271}.footer{margin-top:55px;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--mute)}.menu{display:none}.reflection{font-style:italic;font-family:'Playfair Display',serif;font-size:25px;line-height:1.5}.counter{color:#b36f54;letter-spacing:.15em;font-size:12px;font-weight:700}.noresult{color:var(--mute);font-size:13px;padding:12px}.hidden{display:none}@media(max-width:870px){.app{display:block}.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:min(85vw,340px);height:100vh;box-shadow:0 0 0 100vw #0006}.sidebar.open{display:block}.menu{display:inline-block}.main{padding:24px 22px 60px}.topbar{margin-bottom:34px}.illustration{height:140px;margin:30px 0}.listchap{grid-template-columns:1fr}.hero h1{font-size:clamp(43px,10vw,62px)}.panel{padding:20px}}@media print{.sidebar,.topbar,.actions{display:none}.app{display:block}.main{max-width:100%;padding:20px}.panel{break-inside:avoid}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">THE CHILDHOOD<br>PATTERNS</div><div class="subbrand">A guide to understanding yourself</div><div class="progress"><div class="bar" id="bar"></div></div><div class="progressline" id="progressline">0 of 50 patterns explored</div><input class="search" id="search" placeholder="Search patterns…" aria-label="Search patterns"><nav id="nav"></nav></aside><main class="main"><div class="topbar"><button class="btn secondary menu" id="menu">☰ Chapters</button><span>THE SELF-REFLECTION LIBRARY</span><span id="position">INTRODUCTION</span></div><div id="content"></div><div class="footer">Educational information only · Not a diagnosis, therapy or a substitute for personalized mental healthcare. © 2026 The Childhood Patterns.</div></main></div><script>
const chapters=[["The Need to Be Accepted", "Belonging matters. These patterns examine when acceptance starts to outweigh personal choice."], ["The Fear of Not Being Good Enough", "Explore the pressure to prove your value, and learn to make room for being human."], ["How You Handle Emotions", "Emotions are signals, not character flaws. Notice how you learned to show or hide them."], ["Love, Attachment & Relationships", "Our earliest relationships can influence expectations, but adult relationships can also teach us something new."], ["Control, Safety & Overthinking", "When uncertainty feels uncomfortable, the mind may try to predict everything."], ["Independence & Asking for Help", "Being capable is valuable. Believing you must never need anyone can become exhausting."], ["Conflict, Anger & Communication", "Disagreement can feel very different depending on what you have experienced."], ["Boundaries, Guilt & Responsibility", "Consider where your responsibilities end and another person’s begin."], ["Success, Failure & Self-Worth", "Explore the difference between doing well and needing to earn your worth."], ["Changing Familiar Patterns", "Awareness creates options. Small, repeated changes can support healthier habits."]];const entries=[{"id": 1, "chapter": 0, "title": "Saying yes when you want to say no", "scene": "You agree to an extra task although your schedule is full, then feel frustrated.", "why": "If disagreement once led to criticism or tension, saying yes may have felt safer. Politeness, culture and workplace pressure can also matter.", "question": "What am I afraid will happen if I decline?", "action": "Try a low-stakes response: “I can’t commit to that today.”"}, {"id": 2, "chapter": 0, "title": "Feeling responsible for everyone’s happiness", "scene": "Someone at home is quiet and you immediately try to cheer them up.", "why": "Children sometimes become attentive to adults’ moods, especially in unpredictable homes. Empathy alone does not mean this happened to you.", "question": "Can I care without taking ownership of someone else’s mood?", "action": "Ask, “Would you like support or space?” and let their answer guide you."}, {"id": 3, "chapter": 0, "title": "Needing reassurance before decisions", "scene": "You ask three people whether a small purchase is the right choice.", "why": "Frequent criticism or limited opportunities to choose may weaken confidence in personal judgment. Anxiety and unfamiliarity can do the same.", "question": "What would I choose if no one were available to reassure me?", "action": "Make one reversible decision independently and review how it went."}, {"id": 4, "chapter": 0, "title": "Hiding your opinions to avoid disagreement", "scene": "You pretend to enjoy a plan because everyone else seems enthusiastic.", "why": "When different opinions are unwelcome, staying agreeable can become a habit. Social pressure is another common influence.", "question": "Whose disagreement feels hardest for me to tolerate?", "action": "State a gentle preference: “I’d actually prefer the earlier time.”"}, {"id": 5, "chapter": 0, "title": "Feeling guilty when putting yourself first", "scene": "Taking a quiet evening feels selfish even though you need rest.", "why": "Some families praise self-sacrifice more than rest. Guilt can reflect learned expectations without proving anything about trauma.", "question": "Would I judge a friend for needing the same break?", "action": "Schedule one small rest period without justifying it."}, {"id": 6, "chapter": 1, "title": "Feeling that nothing you do is enough", "scene": "After finishing a good project, you focus only on what could be better.", "why": "Conditional praise or very high expectations can encourage relentless standards. Ambition and workplace culture play a role too.", "question": "What standard am I using, and who set it?", "action": "Write down one thing you completed well before listing improvements."}, {"id": 7, "chapter": 1, "title": "Being afraid of small mistakes", "scene": "A minor typo makes you worry all afternoon.", "why": "Harsh reactions to mistakes may teach children to associate errors with shame. Perfectionism also has many other influences.", "question": "What is the realistic consequence of this mistake?", "action": "Correct what you can, then practice ending the review."}, {"id": 8, "chapter": 1, "title": "Comparing yourself with everyone", "scene": "A friend’s success immediately makes your own progress feel small.", "why": "Repeated comparisons in school or at home may encourage ranking yourself against others. Social media can amplify it.", "question": "What goal matters to me independent of anyone else?", "action": "Record one personal measure of progress this week."}, {"id": 9, "chapter": 1, "title": "Feeling uncomfortable receiving compliments", "scene": "Someone praises your work and you automatically dismiss it.", "why": "If compliments were rare or mixed with criticism, praise may feel unfamiliar. Modesty norms can also contribute.", "question": "What do I assume someone expects when they praise me?", "action": "Try saying only, “Thank you, I appreciate that.”"}, {"id": 10, "chapter": 1, "title": "Connecting your worth to achievements", "scene": "A day without productivity makes you feel like a failure.", "why": "Being rewarded mainly for outcomes can blur the line between performance and identity.", "question": "Who am I when I am not achieving something?", "action": "List three qualities unrelated to grades, income or output."}, {"id": 11, "chapter": 2, "title": "Hiding sadness from close people", "scene": "You insist you are fine even when you are struggling.", "why": "If sadness was minimized or treated as weakness, privacy may have felt protective. Some people simply prefer processing alone.", "question": "Who has earned the right to hear a little more of my truth?", "action": "Share one manageable feeling with a trusted person."}, {"id": 12, "chapter": 2, "title": "Apologizing for having feelings", "scene": "You say sorry for crying during a difficult conversation.", "why": "Messages such as “don’t be dramatic” can teach shame around emotional expression. It is possible to learn more accepting language.", "question": "What would change if I named the feeling without apologizing?", "action": "Replace “Sorry I’m upset” with “I’m upset and need a moment.”"}, {"id": 13, "chapter": 2, "title": "Struggling to identify what you feel", "scene": "You know something is wrong but cannot tell whether it is anger or disappointment.", "why": "Children learn emotional vocabulary through guidance and examples. Without practice, naming feelings may remain difficult.", "question": "Where do I notice this feeling in my body?", "action": "Use a simple list: sad, angry, afraid, joyful, surprised or disgusted."}, {"id": 14, "chapter": 2, "title": "Shutting down during arguments", "scene": "When voices rise, your mind goes blank and you stop responding.", "why": "Stress can narrow attention, and some people learn to withdraw during conflict. This is not enough to identify a trauma response.", "question": "What signs tell me I need a break?", "action": "Say, “I want to continue, but I need 20 minutes to settle.”"}, {"id": 15, "chapter": 2, "title": "Feeling uncomfortable when others cry", "scene": "A friend cries and you rush to solve the problem or change the subject.", "why": "If feelings were rarely discussed, strong emotions may feel unfamiliar or hard to sit with.", "question": "Can I be present without fixing anything?", "action": "Try, “I’m here with you. Do you want to talk?”"}, {"id": 16, "chapter": 3, "title": "Worrying people will leave you", "scene": "A delayed message makes you fear your relationship is in trouble.", "why": "Inconsistent support can sometimes influence expectations of closeness. Current relationship difficulties may also explain worry.", "question": "What evidence do I have beyond the delayed reply?", "action": "Wait, notice the story your mind tells, then ask directly if needed."}, {"id": 17, "chapter": 3, "title": "Finding it hard to trust others", "scene": "You expect a promise to be broken even when the person has been reliable.", "why": "Broken promises or instability can affect trust, but cautiousness may also be reasonable in certain situations.", "question": "What behavior would help someone earn my trust gradually?", "action": "Look for repeated actions rather than demanding instant certainty."}, {"id": 18, "chapter": 3, "title": "Feeling uneasy when someone gets close", "scene": "You enjoy connection until a relationship becomes emotionally intimate.", "why": "Some people learned that closeness could involve pressure or disappointment; others simply need more space.", "question": "What part of closeness feels uncomfortable: time, vulnerability or expectations?", "action": "Name one boundary that allows connection at a comfortable pace."}, {"id": 19, "chapter": 3, "title": "Needing repeated reassurance in relationships", "scene": "You ask whether everything is okay even after your partner says yes.", "why": "Past unpredictability can create heightened sensitivity to changes in connection. Clear communication may help more than guessing.", "question": "What specific reassurance would genuinely help?", "action": "Make a concrete request instead of asking the same broad question repeatedly."}, {"id": 20, "chapter": 3, "title": "Staying in a relationship because solitude feels frightening", "scene": "You overlook repeated disrespect because leaving feels unbearable.", "why": "Uncertainty, financial dependence, loneliness and familiar relationship dynamics can all contribute. No single childhood explanation fits everyone.", "question": "Does this relationship support my safety and dignity?", "action": "Talk confidentially with someone trustworthy; seek specialist support if safety is at risk."}, {"id": 21, "chapter": 4, "title": "Replaying small conversations", "scene": "You revisit a casual comment and wonder whether you offended someone.", "why": "Past criticism can encourage self-monitoring, while anxiety and social expectations can also fuel rumination.", "question": "Am I learning something, or replaying without new information?", "action": "Give yourself five minutes to note a lesson, then shift attention."}, {"id": 22, "chapter": 4, "title": "Imagining the worst outcome", "scene": "A minor change at work instantly becomes a disaster in your mind.", "why": "Anticipating problems may once have helped with uncertainty. It can also reflect current stress.", "question": "What are three realistic outcomes, not just the worst one?", "action": "Write down the most likely outcome and one useful next action."}, {"id": 23, "chapter": 4, "title": "Feeling anxious when plans change", "scene": "A canceled meeting ruins your whole mood.", "why": "Predictability can feel comforting if early routines were inconsistent; change can be stressful for anyone.", "question": "What part of this change is actually difficult?", "action": "Identify one thing that remains within your control."}, {"id": 24, "chapter": 4, "title": "Trying to control every situation", "scene": "You organize everyone’s plans because mistakes feel intolerable.", "why": "Control can be one way of coping with uncertainty. It may also come from personality or demanding roles.", "question": "What can I influence, and what must I allow others to decide?", "action": "Let someone else choose one low-stakes detail."}, {"id": 25, "chapter": 4, "title": "Watching other people’s moods closely", "scene": "You notice tiny changes in tone and immediately assume something is wrong.", "why": "Children in unpredictable environments may become alert to moods, but social sensitivity is not itself a symptom.", "question": "Did the person tell me something was wrong, or did I infer it?", "action": "Check kindly rather than guessing: “You seem quiet. Everything okay?”"}, {"id": 26, "chapter": 5, "title": "Believing you must handle everything alone", "scene": "You struggle silently rather than letting someone assist.", "why": "Early responsibility or unreliable support may make independence feel essential. Pride and personal preference can also contribute.", "question": "What would asking for a little help cost me?", "action": "Request support with one manageable task."}, {"id": 27, "chapter": 5, "title": "Feeling weak when asking for help", "scene": "You admire helpful people but criticize yourself for needing them.", "why": "Messages that strength means self-sufficiency can make normal dependence feel shameful.", "question": "Would I call a friend weak for making this request?", "action": "Practice one direct sentence: “Could you help me with this?”"}, {"id": 28, "chapter": 5, "title": "Becoming the responsible person in every group", "scene": "You automatically plan, remind and fix things for everyone.", "why": "Some children take on caregiving roles early, a pattern sometimes called parentification. Leadership can also simply be a strength.", "question": "Did I choose this responsibility, or did I assume it?", "action": "Delegate one task and allow another person to complete it their way."}, {"id": 29, "chapter": 5, "title": "Finding it difficult to rely on anyone", "scene": "You double-check every favor rather than trust another person to follow through.", "why": "Disappointment can encourage protective independence. Trust can be rebuilt incrementally, not on demand.", "question": "Who has shown reliability through actions?", "action": "Start with one small, clearly agreed responsibility."}, {"id": 30, "chapter": 5, "title": "Feeling uneasy when someone cares for you", "scene": "Someone brings you food when you are tired and you immediately feel indebted.", "why": "Care may feel unfamiliar if you learned to be the helper. Some cultures also place strong importance on reciprocity.", "question": "Can receiving kindness be enough in this moment?", "action": "Accept a small gesture with “Thank you” and no immediate repayment."}, {"id": 31, "chapter": 6, "title": "Avoiding difficult conversations", "scene": "You postpone a necessary discussion until the problem gets bigger.", "why": "Conflict may feel risky if disagreement once escalated. Avoidance can also come from uncertainty about what to say.", "question": "What is the cost of not addressing this?", "action": "Write a one-sentence opening and choose a calm time."}, {"id": 32, "chapter": 6, "title": "Feeling frightened when voices rise", "scene": "Raised voices make you tense even when no threat is intended.", "why": "Past experiences with shouting can affect how safe conflict feels. Sensitivity to noise has other explanations too.", "question": "What helps me feel grounded and able to choose my response?", "action": "Move to a quieter setting and ask to continue respectfully."}, {"id": 33, "chapter": 6, "title": "Becoming defensive when receiving feedback", "scene": "Even helpful suggestions feel like attacks on your character.", "why": "If correction was paired with humiliation, feedback may be difficult to separate from judgment.", "question": "Is this feedback about a behavior or my entire identity?", "action": "Ask for one concrete example before responding."}, {"id": 34, "chapter": 6, "title": "Staying silent when something hurts", "scene": "You say nothing after a hurtful remark, then think about it for days.", "why": "Silence may have been safer in environments where speaking up was punished or ignored.", "question": "What would a respectful version of speaking up sound like?", "action": "Try, “That comment bothered me. Can we talk about it?”"}, {"id": 35, "chapter": 6, "title": "Struggling to communicate your needs", "scene": "You hope others notice you are exhausted without having to ask.", "why": "Needs can be hard to name when they were dismissed or never discussed openly.", "question": "What do I need right now: time, clarity, help or comfort?", "action": "Make one specific request without expecting mind-reading."}, {"id": 36, "chapter": 7, "title": "Feeling selfish when setting boundaries", "scene": "You feel guilty for not answering a late-night work message.", "why": "People who were praised for always being available may struggle with limits. Boundaries protect capacity, not just comfort.", "question": "What limit would make this relationship or work sustainable?", "action": "State your available hours clearly and kindly."}, {"id": 37, "chapter": 7, "title": "Taking blame for problems you did not cause", "scene": "When a group plan fails, you apologize even though you were uninvolved.", "why": "Some children learn to prevent conflict by taking responsibility. Adult workplace dynamics can reinforce it.", "question": "What part of this outcome was truly mine to manage?", "action": "Name your contribution accurately without accepting the entire blame."}, {"id": 38, "chapter": 7, "title": "Not knowing what you want", "scene": "Choosing a restaurant feels harder than accommodating everyone else.", "why": "When preferences were rarely invited, paying attention to them may require practice.", "question": "What would I choose if nobody had a preference?", "action": "Make a small choice and observe how it feels."}, {"id": 39, "chapter": 7, "title": "Feeling obligated to meet all expectations", "scene": "You pursue a goal because it would please others, not because it matters to you.", "why": "Family and social expectations can become internal rules. Some are meaningful; others deserve examination.", "question": "Which expectations align with my values today?", "action": "Choose one expectation to reconsider with curiosity, not blame."}, {"id": 40, "chapter": 7, "title": "Being available even when exhausted", "scene": "You keep responding to requests after your energy is gone.", "why": "A habit of proving reliability may override signals for rest. External pressures may also leave little choice.", "question": "What happens when I consistently ignore my limits?", "action": "Set one realistic response window or protected break."}, {"id": 41, "chapter": 8, "title": "Procrastinating because perfection feels necessary", "scene": "You cannot begin a simple task until the conditions feel ideal.", "why": "Fear of criticism or harsh self-evaluation may make starting feel dangerous. Time management problems have many causes.", "question": "What would a useful, imperfect first version look like?", "action": "Work on a deliberately rough draft for ten minutes."}, {"id": 42, "chapter": 8, "title": "Feeling uncomfortable when life goes well", "scene": "A peaceful week makes you wait for something bad to happen.", "why": "If uncertainty was common earlier in life, calm may feel unfamiliar. Current anxiety can create similar worry.", "question": "Can I notice calm without predicting its end?", "action": "Name three neutral or pleasant facts about today."}, {"id": 43, "chapter": 8, "title": "Dismissing your achievements", "scene": "You reach a goal and immediately say it was just luck.", "why": "Some people learn to downplay success to avoid attention or pressure. Impostor feelings are common across backgrounds.", "question": "What effort or skill actually helped me succeed?", "action": "Record the specific actions that contributed to the result."}, {"id": 44, "chapter": 8, "title": "Avoiding opportunities because failure feels threatening", "scene": "You skip applying for a role unless you meet every requirement.", "why": "A history of harsh responses to mistakes may raise the emotional cost of trying.", "question": "What could I learn even if I do not succeed?", "action": "Take one small step toward an opportunity without requiring certainty."}, {"id": 45, "chapter": 8, "title": "Working excessively to feel worthy", "scene": "Rest feels uncomfortable unless you have earned it through work.", "why": "When approval is tied to productivity, stopping can feel like losing value. Economic demands also shape work habits.", "question": "What does enough look like for today?", "action": "Set a finishing point and practice honoring it."}, {"id": 46, "chapter": 9, "title": "Repeating familiar relationship dynamics", "scene": "You keep choosing friendships in which you do most of the emotional work.", "why": "People can gravitate toward familiar roles, though availability, circumstances and chance also affect relationships.", "question": "What role do I repeatedly take, and do I want it?", "action": "Notice reciprocity in one relationship without rushing to label it."}, {"id": 47, "chapter": 9, "title": "Confusing familiar with safe", "scene": "You feel drawn to an intense dynamic because it seems normal.", "why": "Familiar experiences may feel predictable even when uncomfortable; predictability is not the same as safety.", "question": "What does safety look like in observable behavior?", "action": "Write three signs of respectful, consistent treatment."}, {"id": 48, "chapter": 9, "title": "Judging yourself for having emotions", "scene": "You become upset and then criticize yourself for being upset.", "why": "Negative messages about feelings can turn normal emotions into a source of shame.", "question": "Can I let a feeling exist without approving every action it suggests?", "action": "Say, “This feeling is here; I can choose what to do next.”"}, {"id": 49, "chapter": 9, "title": "Feeling indebted when someone is kind", "scene": "A thoughtful gift makes you feel you must return something immediately.", "why": "In some environments, kindness may have come with conditions. Reciprocity norms and personal values also play roles.", "question": "Did this person request repayment, or am I assuming it?", "action": "Receive one small kindness without making a matching offer right away."}, {"id": 50, "chapter": 9, "title": "Believing your past defines your future", "scene": "You decide that because you have always behaved one way, change is impossible.", "why": "Early learning can feel deeply ingrained, but new habits and supportive relationships can create different experiences.", "question": "What is one recent moment when I responded differently?", "action": "Choose one pattern to observe kindly for seven days, without scoring yourself."}];const seen=new Set(JSON.parse(localStorage.getItem('childhood-seen')||'[]'));let current=-1;const content=document.getElementById('content'),sidebar=document.getElementById('sidebar');function closeMenu(){sidebar.classList.remove('open')};function setSeen(n){seen.add(n);localStorage.setItem('childhood-seen',JSON.stringify([...seen]));updateProgress()}function updateProgress(){document.getElementById('bar').style.width=(seen.size/50*100)+'%';document.getElementById('progressline').textContent=`${seen.size} of 50 patterns explored`};function nav(){let q=document.getElementById('search').value.trim().toLowerCase();let out='<button class="navitem" data-index="-1">⌂ &nbsp; Start here</button>';chapters.forEach((c,i)=>{let list=entries.filter(e=>e.chapter===i&&(e.title.toLowerCase().includes(q)||c[0].toLowerCase().includes(q)));if(!list.length)return;out+=`<div class="navchapter"><button class="chapterbtn" data-index="${i*5}">${String(i+1).padStart(2,'0')} · ${c[0]}</button>`+list.map(e=>`<button class="navitem ${current===e.id-1?'active':''}" data-index="${e.id-1}">${seen.has(e.id)?'✓':'○'} &nbsp;${e.id}. ${e.title}</button>`).join('')+'</div>'});document.getElementById('nav').innerHTML=out;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>show(+b.dataset.index));}function show(i){current=i;closeMenu();document.getElementById('position').textContent=i<0?'INTRODUCTION':`PATTERN ${String(i+1).padStart(2,'0')} / 50`;if(i<0){content.innerHTML=`<section class="hero"><span class="tag">An interactive guide · 50 patterns · 10 chapters</span><h1>The patterns you <em>carry.</em></h1><p class="lead">50 patterns you may have learned in childhood — a gentle guide to understanding yourself, your habits, and the choices available to you today.</p><div class="illustration" aria-hidden="true"></div><p class="copy">Have you ever wondered why saying no feels difficult, why feedback sometimes stings, or why you find it hard to ask for help? Childhood is one place where we learn about feelings, trust, conflict, and belonging. But it is never the only explanation for who we become.</p><div class="note"><strong>Start with curiosity, not a label.</strong> These are relatable patterns, not a test for trauma. You do not need to identify with any of them. Skip anything that feels uncomfortable and return whenever you choose.</div><h3>How to use this book</h3><p class="copy">Read in order or choose a pattern from the chapter menu. Each short entry contains an everyday example, a possible explanation, a reflection question, and a small optional practice. Mark entries as explored to keep your place on this device.</p><div class="actions"><button class="btn" id="start">Start reading →</button></div><h3>Explore 10 chapters</h3><div class="listchap">${chapters.map((c,j)=>`<button class="chaptercard" data-go="${j*5}"><span>CHAPTER ${String(j+1).padStart(2,'0')}</span>${c[0]}</button>`).join('')}</div><div class="panel sage"><h3>About this guide</h3><p>Early experiences can influence beliefs and relationships, yet temperament, culture, current stress, support, and later experiences also matter. No single habit proves childhood trauma. If reflection brings up intense distress, consider speaking with a qualified mental-health professional.</p></div><h3>Sources & further reading</h3><p class="copy"><a href="https://www.cdc.gov/aces/about/index.html" target="_blank" rel="noopener">CDC — About Adverse Childhood Experiences</a><br><a href="https://www.samhsa.gov/trauma-violence" target="_blank" rel="noopener">SAMHSA — Trauma and Violence</a><br><a href="https://www.who.int/news-room/fact-sheets/detail/child-maltreatment" target="_blank" rel="noopener">WHO — Child Maltreatment</a></p><p class="small">These references provide background context; the 50 everyday patterns are educational examples, not individually validated trauma indicators.</p></section>`;document.getElementById('start').onclick=()=>show(0);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));}else{let e=entries[i],ch=chapters[e.chapter];content.innerHTML=`<div class="counter">CHAPTER ${String(e.chapter+1).padStart(2,'0')} · PATTERN ${String(e.id).padStart(2,'0')}</div><h2>${e.title}</h2><p class="chapintro">${ch[1]}</p><div class="panel"><h3>Picture this</h3><p>${e.scene}</p></div><h3>Where might this come from?</h3><p class="copy">${e.why}</p><div class="panel peach"><h3>Pause & reflect</h3><p class="reflection">“${e.question}”</p></div><div class="panel sage"><h3>One gentle step</h3><p>${e.action}</p></div><p class="small">Reflection prompt, not a clinical assessment. There may be many explanations for this pattern. Skip the exercise if it feels unhelpful.</p><div class="actions"><button class="btn" id="done">${seen.has(e.id)?'✓ Explored':'✓ Mark as explored'}</button><button class="btn secondary" id="prev" ${i===0?'disabled':''}>← Previous</button><button class="btn secondary" id="next">${i===49?'Back to introduction':'Next pattern →'}</button></div>`;document.getElementById('done').onclick=()=>{setSeen(e.id);nav();document.getElementById('done').textContent='✓ Explored'};document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i===49?-1:i+1);}nav();window.scrollTo(0,0);history.replaceState(null,'',i<0?'#start':'#pattern-'+(i+1));};document.getElementById('search').addEventListener('input',nav);document.getElementById('menu').onclick=()=>sidebar.classList.toggle('open');updateProgress();let hash=location.hash.match(/pattern-(\d+)/);show(hash?Math.min(49,Math.max(0,+hash[1]-1)):-1);
</script></body></html>
